name: Build PKHeX Emerald Legacy Enhanced

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish WinForms (Release, win-x64)
        run: >
          dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath PKHeX-Emerald-Legacy-Enhanced.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Emerald-Legacy-Enhanced
          path: PKHeX-Emerald-Legacy-Enhanced.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PKHeX-Emerald-Legacy-Enhanced.zip
          generate_release_notes: true
